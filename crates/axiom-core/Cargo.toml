[package]
name = "axiom-core"
version = "0.1.0"
edition = "2021"
description = "Axiom Rust Core sidecar — file walking, search, and code intelligence (PRD Epoch C)."
license = "MIT"

[[bin]]
name = "axiom-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
notify = "6"
tree-sitter = "0.20"
tree-sitter-rust = "0.20"
tree-sitter-javascript = "0.20"
tree-sitter-typescript = "0.20"
tree-sitter-python = "0.20"
rusqlite = { version = "0.31", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Note: [profile.release] is defined at the workspace root (../../Cargo.toml);
# profiles in member crates are ignored by Cargo.
