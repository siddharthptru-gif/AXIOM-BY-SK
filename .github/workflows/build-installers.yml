name: Build signed AXIOM Windows x64 package

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: axiom-windows-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20.18.0'
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install lockfile dependencies
        run: npm ci

      - name: Build reviewed native core
        run: cargo build --release --locked -p axiom-core

      - name: Type-check and run focused security suites
        shell: pwsh
        run: |
          npm.cmd run typecheck --workspace apps/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run validate:agentic-chat --workspace apps/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run validate:github-scm --workspace apps/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run validate:god-mode --workspace apps/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run validate:security-hardening --workspace apps/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # No signing secrets are available to npm, electron-vite, electron-builder,
      # dependency lifecycle scripts, afterPack, or afterAllArtifactBuild.
      - name: Build production bundles without signing credentials
        run: npm run build --workspace apps/desktop

      - name: Create unsigned unpacked application
        shell: pwsh
        working-directory: apps/desktop
        run: |
          node scripts/prepare-package-output.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ..\..\node_modules\.bin\electron-builder.cmd --win --dir --config.win.sign=null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign unpacked application in dedicated boundary
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AXIOM_SIGNER_SHA1: ${{ vars.AXIOM_SIGNER_SHA1 }}
          AXIOM_SIGNER_SUBJECT: ${{ vars.AXIOM_SIGNER_SUBJECT }}
        run: |
          & '.\AXIOM EXE\sign-release-artifacts.ps1' -Mode App -Path '.\AXIOM EXE\dist\win-unpacked'

      - name: Verify signed application resources, fuses, inventory, and launch
        run: node apps/desktop/scripts/verify-packaged-runtime.cjs "AXIOM EXE/dist/win-unpacked"

      # The installer assembler receives no certificate or password. It consumes
      # only the already-signed prepackaged application directory.
      - name: Assemble unsigned NSIS from signed application
        shell: pwsh
        working-directory: apps/desktop
        run: |
          & ..\..\node_modules\.bin\electron-builder.cmd --win nsis --prepackaged '..\..\AXIOM EXE\dist\win-unpacked' --config.win.sign=null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign final installer in dedicated boundary
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AXIOM_SIGNER_SHA1: ${{ vars.AXIOM_SIGNER_SHA1 }}
          AXIOM_SIGNER_SUBJECT: ${{ vars.AXIOM_SIGNER_SUBJECT }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath '.\AXIOM EXE\dist' -Filter 'AXIOM-Setup-*-x64.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one installer; found $($installers.Count)." }
          & '.\AXIOM EXE\sign-release-artifacts.ps1' -Mode Installer -Path $installers[0].FullName

      - name: Final post-sign verification and SHA-256 sidecars
        shell: pwsh
        env:
          AXIOM_SIGNER_SHA1: ${{ vars.AXIOM_SIGNER_SHA1 }}
          AXIOM_SIGNER_SUBJECT: ${{ vars.AXIOM_SIGNER_SUBJECT }}
        run: |
          node apps/desktop/scripts/verify-packaged-runtime.cjs "AXIOM EXE/dist/win-unpacked"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $expectedThumbprint = $env:AXIOM_SIGNER_SHA1.Replace(' ', '').ToUpperInvariant()
          if ($expectedThumbprint -notmatch '^[0-9A-F]{40}$' -or [string]::IsNullOrWhiteSpace($env:AXIOM_SIGNER_SUBJECT)) {
            throw 'Pinned signer identity variables are required.'
          }
          $dist = Join-Path $PWD 'AXIOM EXE/dist'
          $targets = @(
            Get-ChildItem -LiteralPath (Join-Path $dist 'win-unpacked') -Recurse -File |
              Where-Object { $_.Extension.ToLowerInvariant() -in @('.exe', '.dll', '.node') }
            Get-ChildItem -LiteralPath $dist -Filter 'AXIOM-Setup-*-x64.exe' -File
          )
          if ($targets.Count -eq 0) { throw 'No executable artifacts were produced.' }
          foreach ($target in $targets) {
            $signature = Get-AuthenticodeSignature -LiteralPath $target.FullName
            if ($signature.Status -ne 'Valid' -or
                -not $signature.SignerCertificate -or
                $signature.SignerCertificate.Thumbprint.Replace(' ', '').ToUpperInvariant() -ne $expectedThumbprint -or
                $signature.SignerCertificate.Subject -ne $env:AXIOM_SIGNER_SUBJECT -or
                -not $signature.TimeStamperCertificate) {
              throw "Signer, timestamp, or signature verification failed for $($target.Name)."
            }
          }
          $artifacts = @(Get-ChildItem -LiteralPath $dist -File | Where-Object {
            $_.Name -match '^AXIOM-Setup-.*-x64\.exe$|\.blockmap$|^latest(?:-[A-Za-z0-9._-]+)?\.(?:yml|yaml|json)$'
          })
          if ($artifacts.Count -eq 0 -or $artifacts.Count -gt 64) { throw 'Final artifact count is invalid.' }
          Get-ChildItem -LiteralPath $dist -Filter '*.sha256' -File -ErrorAction SilentlyContinue | Remove-Item -Force
          foreach ($artifact in $artifacts) {
            $digest = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$($artifact.FullName).sha256", "$digest  $($artifact.Name)`n", [Text.UTF8Encoding]::new($false))
          }
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path -LiteralPath "$($artifact.FullName).sha256" -PathType Leaf)) {
              throw "Missing final sidecar for $($artifact.Name)."
            }
          }

      - name: Upload signed installer and verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axiom-windows-x64-signed
          path: |
            AXIOM EXE/dist/AXIOM-Setup-*-x64.exe
            AXIOM EXE/dist/AXIOM-Setup-*-x64.exe.sha256
            AXIOM EXE/dist/*.blockmap
            AXIOM EXE/dist/*.blockmap.sha256
            AXIOM EXE/dist/latest*.yml
            AXIOM EXE/dist/latest*.yml.sha256
          if-no-files-found: error
